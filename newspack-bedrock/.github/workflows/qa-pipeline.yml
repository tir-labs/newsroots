name: Advanced QA & Code Review

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  compile-and-trace:
    name: Compile, Trace & Verify Bedrock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer, phpstan, psalm, rector

      - name: Setup Node.js (for Sage/Bud compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Compile without errors (Syntax Check)
        run: |
          find packages -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null
          composer validate --strict --no-check-publish

      - name: Verify Bedrock, Sage & Acorn (Eloquent) Structure
        run: composer test

      - name: Step Tracing & Backwards Taint Analysis (Psalm)
        run: |
          # Psalm's taint analysis tracks data flow backwards from sinks (e.g. SQL/echo) to sources (e.g. $_GET)
          psalm --taint-analysis --report=taint-report.json || echo "Taint analysis found potential paths to review"

      - name: Learn & Improve Code (Rector)
        run: |
          # Rector automatically learns and suggests code improvements for modern PHP and Laravel/Acorn patterns
          rector process packages/ --dry-run || echo "Rector found code quality improvements"

      - name: Check Sage & Bud.js NPM Compatibility
        run: |
          # Ensure any packaged npm scripts are compatible with Roots Sage ecosystem
          for dir in packages/*; do
            if [ -f "$dir/package.json" ]; then
              echo "Checking NPM compatibility in $dir"
              npm --prefix "$dir" install --no-audit --no-fund || exit 1
              npm --prefix "$dir" run build --if-present || exit 1
            fi
          done

      - name: Create Issue on Error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prevent duplicate issues for the same commit
          ISSUE_EXISTS=$(gh issue list --search "Pipeline Failure: ${{ github.sha }} in:title" --json number -q '.[0].number')
          if [ -z "$ISSUE_EXISTS" ]; then
            gh issue create               --title "🚨 Pipeline Failure: ${{ github.sha }}"               --body "The CI/CD pipeline failed during compilation, step tracing, or Bedrock compatibility checks on commit ${{ github.sha }}. Please review the Actions log."               --label "bug"
          fi

  ai-quality-review:
    name: AI Quality Review & Code Learning
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CodeRabbit AI Reviewer
        uses: coderabbitai/coderabbit-action@v1
        with:
          # Automatically reviews PRs, traces code step-by-step, and suggests intelligent architectural improvements
          enable_alerts: true
