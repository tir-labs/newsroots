<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;display=swap');
      .logo-text { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 56px; fill: #A78BD6; letter-spacing: -2px; }
      .logo-news { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 56px; fill: #FFFFFF; letter-spacing: -2px; }
      .logo-woo { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 56px; fill: #A78BD6; letter-spacing: -2px; }
      .logo-tagline { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #CCCCCC; letter-spacing: 3px; text-transform: uppercase; }
    </style>
  </defs>
  <!-- Icon: stylized newspaper merged with WooCommerce bag -->
  <g transform="translate(10, 10)">
    <!-- Newspaper shape -->
    <rect x="0" y="8" width="44" height="54" rx="4" fill="#A78BD6" opacity="0.12"/>
    <rect x="4" y="12" width="36" height="4" rx="2" fill="#A78BD6" opacity="0.6"/>
    <rect x="4" y="20" width="36" height="2" rx="1" fill="#A78BD6" opacity="0.3"/>
    <rect x="4" y="26" width="24" height="2" rx="1" fill="#A78BD6" opacity="0.3"/>
    <rect x="4" y="32" width="36" height="2" rx="1" fill="#A78BD6" opacity="0.3"/>
    <rect x="4" y="38" width="28" height="2" rx="1" fill="#A78BD6" opacity="0.3"/>
    <rect x="4" y="44" width="36" height="2" rx="1" fill="#A78BD6" opacity="0.3"/>
    <rect x="4" y="50" width="20" height="2" rx="1" fill="#A78BD6" opacity="0.3"/>
    <!-- WooCommerce bag handle -->
    <path d="M28 0 C28 0, 38 0, 38 8 L38 12 L28 12 L28 8 C28 5, 28 3, 28 0 Z" fill="none" stroke="#A78BD6" stroke-width="3"/>
    <!-- Bag body accent -->
    <rect x="26" y="12" width="18" height="14" rx="2" fill="#A78BD6" opacity="0.15"/>
  </g>
  <!-- Text -->
  <text x="72" y="58">
    <tspan class="logo-news">News</tspan><tspan class="logo-woo">Woo</tspan>
  </text>
  <!-- Tagline -->
  <text x="74" y="80" class="logo-tagline">WooCommerce for Newsrooms</text>
</svg>
